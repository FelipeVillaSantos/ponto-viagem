# Monta o APK do Ponto de Viagem e publica em Releases.
# Roda sozinho a cada atualização do app (ou manualmente em Actions → "Gerar APK" → Run workflow).
name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "index.html"
      - "vendor/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Instalar dependências
        run: npm ci

      - name: Embutir o app (index.html) no APK
        run: node scripts/build-web.js

      - name: Número da versão
        run: |
          VERSAO="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          node -e '
            const fs=require("fs");const c=JSON.parse(fs.readFileSync("app.json"));
            c.expo.version=process.env.VERSAO;c.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json",JSON.stringify(c,null,2));'

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Assinatura fixa (para atualizar por cima sem desinstalar)
        run: cp assinatura/ponto-viagem.keystore android/app/debug.keystore

      - name: Compilar APK
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Mostrar o erro do build
        if: failure()
        run: |
          MSG=$( (grep -A25 "What went wrong" build.log || grep -iE "error|exception" build.log | tail -40 || tail -40 build.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erro no build::${MSG}"

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ponto-viagem.apk"
          gh release create "v${VERSAO}" "ponto-viagem.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ponto de Viagem ${VERSAO}" \
            --notes "Baixe o arquivo ponto-viagem.apk abaixo e toque nele no celular para instalar ou atualizar. Seus dados continuam no aparelho." \
            --latest
